name: Portable checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -p 'test_portable*.py' -q
      - run: python scripts/check_portable_plugin.py
      - run: python scripts/build_chatgpt_plugin.py --variant portable --output /tmp/careerground-portable.zip
